[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fav-image"
version = "0.1.0"
description = "Feature-space Amortized Variational alignment for ImageNet generative backbones"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "FAV-image authors"}]

dependencies = [
    "torch>=2.1",
    "torchvision",
    "diffusers>=0.27",
    "transformers>=4.40",
    "accelerate>=0.30",
    "omegaconf>=2.3",
    "hydra-core>=1.3",
    "numpy",
    "pillow",
    "opencv-python",
    "tqdm",
    "wandb",
]

[project.optional-dependencies]
jax = [
    "jax>=0.4.30",
    "jaxlib",
    "flax>=0.8",
    "optax",
]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
include = ["main*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
