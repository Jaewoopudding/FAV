# @package _global_
# StyleGAN-XL × DRaFT × aesthetic.
defaults:
  - override /backbone: stylegan_xl
  - override /algorithm: draft
  - override /reward: aesthetic

run_name: stylegan_xl_draft_aesthetic
seed: 0

backbone:
  sample:
    truncation_psi: 0.7
  lora:
    rank: 32
    alpha: 32
    dropout: 0.0

algorithm:
  num_steps: 200
  reward_multiplier: 0.01
  optimizer:
    lr: 5.0e-4
  scheduler:
    warmup_steps: 0
  max_grad_norm: 2.0

runtime:
  micro_batch_size: 4
  eval_batch_size: 16
  gen_bsz: 16

eval_interval: 10
