# Top-level Hydra config — composes backbone + algorithm + reward.

defaults:
  - backbone: imf
  - algorithm: fav
  - reward: aesthetic
  - _self_

workdir: runs
run_name: null            # auto-generated from key params if null
seed: 0

eval_interval: 10
save_interval: ${algorithm.num_steps}   # save once at the end
log_interval: 1

resume_from: null

runtime:
  micro_batch_size: 4
  grad_accum_steps: 1     # placeholder; scripts.train overwrites per algorithm
  eval_batch_size: 16
  mixed_precision: fp32   # fp32 | fp16 | bf16
  gen_bsz: 64             # VAE decode batch size

wandb:
  enabled: true
  project: FAV
