# DRaFT — direct reward backprop / reward maximization.
name: draft
forward_mode: sample
required_capabilities: []     # works on all 4 backbones

reward_multiplier: 1.0

total_batch_size: 256         # summed across all GPUs; grad_accum derived at runtime

optimizer:
  type: adamw
  lr: 4.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.95]
scheduler:
  type: constant
  warmup_steps: 500
max_grad_norm: 2.0

num_steps: 1000
labels: [207, 22, 291, 387, 985, 483, 562, 649, 0, 9, 39, 55, 69, 80, 105, 108,
         115, 130, 398, 403, 404, 409, 414, 497, 540, 547, 550, 561, 620, 650, 671, 732]

# DRaFT needs a differentiable reward; for non-differentiable rewards use algorithm=fav with NES.
