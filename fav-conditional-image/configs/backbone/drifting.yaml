# Drifting (JAX) — single-pass generator; trained via scripts/train_drifting.py.
name: drifting
backend: jax
init_from: hf://latent_L_sota
workdir: runs/drifting
img_resolution: 256

sample:
  cfg_omega: 1.5          # forwarded as --cfg-scale

lora:
  rank: 32
  alpha: 128
  dropout: 0.0
  target_modules: null    # fixed flax pytree injection target
